[build]
  # Situs ini hanya API; folder public berisi halaman kecil agar source code tidak ikut dipublikasikan.
  publish = "public"

[functions]
  directory = "netlify/functions"
  # esbuild menggabungkan semua file jadi satu bundle. Bundler "nft" mengubah tiap file ESM ke
  # CommonJS secara terpisah, dan itu merusak `export default` antar file (app.use menerima objek).
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
